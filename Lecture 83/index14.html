<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="height: 2000px;">
    <button onclick="scrollToTop()" style="position: sticky; top: 20px; margin: 100px;">Go to Top</button>
    <script>
        function scrollToTop(){
            window.scrollTo({
                top: 0,
                behavior: "smooth",
            });
        }
    </script>
</body>
</html>
